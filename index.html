<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LCARS Life">
<link rel="manifest" href="manifest.webmanifest">
<title>LCARS // MTG Life Support</title>
<style>
:root{color-scheme:dark;--bg:#090b16;--surface:#121527;--edge:#26283c;--peach:#ffb789;--orange:#fa976b;--lav:#bca5f9;--pink:#e994bd;--blue:#98c7fa;--mint:#96dfc8;--ink:#161222;--muted:#a4a5bc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:#f4ecfa;font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}button,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}button:active{filter:brightness(1.2)}
.app{width:min(100%,1000px);margin:0 auto;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));min-height:100dvh;display:flex;flex-direction:column;gap:12px}
.masthead{display:grid;grid-template-columns:24px minmax(0,1fr);gap:5px;min-height:93px}.mast-rail{background:var(--lav);border-radius:18px 0 0 0}.mast-core{display:grid;grid-template-rows:49px 14px 24px;gap:3px}.mast-title{display:flex;align-items:center;justify-content:space-between;gap:7px;background:var(--peach);border-radius:0 18px 0 0;padding:0 14px;color:var(--ink);font-weight:900;letter-spacing:.12em;font-size:clamp(16px,3.5vw,27px)}.mast-id{font-size:10px;letter-spacing:.06em;white-space:nowrap}.mast-stripes{display:flex;gap:5px}.mast-stripes span:nth-child(1){width:20%;background:var(--pink)}.mast-stripes span:nth-child(2){width:11%;background:var(--bg)}.mast-stripes span:nth-child(3){flex:1;background:var(--lav)}.mast-sub{display:flex;align-items:center;justify-content:space-between;color:var(--blue);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.toolbar{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}.pill{border:0;border-radius:13px;padding:12px 13px;background:var(--edge);color:var(--blue);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;min-height:42px}.pill.active{background:var(--lav);color:var(--ink)}.pill.alt{background:#343049;color:var(--peach)}.grow{flex:1}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.status:before{content:"";height:8px;width:8px;background:var(--mint);border-radius:50%;box-shadow:0 0 10px #96dfc866}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;flex:1;align-content:stretch}.board.solo{grid-template-columns:1fr}.board.tabletop{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}.board.tabletop.four{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.board.tabletop .player:first-child{transform:rotate(180deg)}.board.tabletop.four .player:nth-child(2){transform:rotate(180deg)}.board.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.player{--accent:var(--orange);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:265px;background:linear-gradient(145deg,#171a2d,#101221);border:1px solid #393146;border-radius:18px 9px 18px 9px}.player:before{content:"";height:8px;background:var(--accent);width:100%;display:block}.player-header{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:9px 10px 0}.player-name{border:0;background:transparent;min-width:0;max-width:75%;font-weight:800;font-size:clamp(12px,2.2vw,17px);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;outline:none;border-bottom:1px dotted #56566e;border-radius:0;padding:3px 0}.player-name:focus{border-bottom-color:white}.player-code{font-size:9px;color:var(--muted);letter-spacing:.09em;white-space:nowrap}
.life-zone{display:grid;grid-template-columns:minmax(58px,1fr) minmax(0,1.45fr) minmax(58px,1fr);align-items:stretch;gap:4px;min-height:150px;flex:1;padding:8px 8px 2px}.life-control{border:0;color:var(--ink);border-radius:9px;background:var(--accent);font-size:clamp(27px,7vw,45px);font-weight:800;min-width:0}.life-control.minus{background:#38344f;color:#ffb5af}.life-center{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0}.life-label{font-size:9px;letter-spacing:.3em;color:var(--muted);font-weight:800}.life-number{font-size:clamp(62px,14vw,110px);font-weight:900;line-height:1.1;letter-spacing:-.08em;font-variant-numeric:tabular-nums;padding-right:.08em;user-select:none}.life-number.danger{color:#ff7b90}.life-number.dead{color:#ff6677;text-decoration:line-through;text-decoration-thickness:3px}.player-footer{display:flex;gap:5px;padding:7px 8px 9px}.micro{border:0;background:#25263d;color:#d4c8ef;flex:1;min-height:37px;font-size:11px;letter-spacing:.06em;font-weight:800;border-radius:7px}.micro.poisoned{background:#3e344c;color:var(--mint)}.micro.damage{background:#35304b;color:var(--peach)}.player:nth-child(2){--accent:var(--blue)}.player:nth-child(3){--accent:var(--pink)}.player:nth-child(4){--accent:var(--mint)}
.board.tabletop .player{min-height:240px}.board.tabletop.four .player{min-height:210px}.board.tabletop .player-header{flex-shrink:0}.board.tabletop .life-zone{min-height:110px}.board.tabletop.four .life-zone{min-height:95px}.board.tabletop.four .life-number{font-size:clamp(44px,12vw,90px)}.board.tabletop.four .life-control{font-size:clamp(24px,6vw,42px)}.board.tabletop.four .player-footer{flex-wrap:wrap}.board.tabletop.four .micro{min-height:33px}.board.tabletop .player-name{touch-action:auto}.bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.rail{height:25px;display:flex;gap:5px}.rail span:nth-child(1){width:24%;background:var(--lav);border-radius:0 0 0 15px}.rail span:nth-child(2){width:12%;background:var(--peach)}.rail span:nth-child(3){flex:1;background:var(--pink);border-radius:0 0 15px 0}.footnote{color:var(--muted);font-size:10px;letter-spacing:.1em;white-space:nowrap}
.dialog-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}.dialog-backdrop.show{display:flex}.dialog{background:#171829;border:2px solid var(--lav);border-radius:18px;width:min(100%,470px);padding:18px;max-height:90dvh;overflow:auto;box-shadow:0 20px 100px #000}.dialog h2{font-size:17px;margin:0 0 8px;letter-spacing:.1em;color:var(--peach);text-transform:uppercase}.dialog p{color:#c1bdd4;line-height:1.5;font-size:13px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.dialog label{display:flex;justify-content:space-between;align-items:center;margin:12px 0;color:#ddd;font-size:13px;gap:12px}.dialog input[type=number]{width:76px;background:#090b16;color:white;border:1px solid #55516d;border-radius:7px;padding:9px}.dialog select{background:#090b16;color:white;border:1px solid #55516d;border-radius:7px;padding:9px;max-width:170px}.damage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.damage-card{background:#25243a;padding:10px;border-radius:9px}.damage-card strong{font-size:12px;display:block;color:var(--blue);margin-bottom:8px}.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px}.stepper button{border:0;background:var(--lav);color:#1b1528;border-radius:7px;width:38px;height:38px;font-size:24px;font-weight:800}.stepper span{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}.tips{font-size:12px;color:var(--muted);line-height:1.6;margin:6px 0}.tiny{font-size:11px;color:#bbb}
@media(min-width:700px){.app{gap:15px}.board{gap:14px}.player{min-height:340px}.life-zone{min-height:200px}.player-footer{padding:10px}.micro{min-height:45px}.pill{font-size:13px}}
@media(max-width:420px){.board.tabletop .player{min-height:240px}.board.tabletop.four .player{min-height:210px}.board.tabletop.four .life-zone{grid-template-columns:minmax(34px,1fr) minmax(0,1.5fr) minmax(34px,1fr)}.board.tabletop.four .life-number{font-size:clamp(39px,11vw,58px)}.board.tabletop.four .player-code{display:none}.board.tabletop.four .player-name{max-width:100%}.board.tabletop.four .micro{font-size:9px;min-height:32px}.app{gap:9px}.masthead{min-height:83px}.mast-core{grid-template-rows:44px 12px 21px}.mast-title{letter-spacing:.055em;font-size:17px;padding:0 9px}.mast-id{font-size:8px}.mast-sub{font-size:9px;letter-spacing:.08em}.toolbar{gap:5px}.pill{padding:10px 9px;font-size:10px;min-height:39px}.board{gap:7px}.player{min-height:255px}.life-zone{grid-template-columns:minmax(44px,1fr) minmax(0,1.5fr) minmax(44px,1fr);padding:8px 5px 2px;gap:3px}.life-number{font-size:clamp(49px,13.5vw,74px)}.player-header{padding:8px 7px 0}.player-code{font-size:8px}.micro{font-size:10px;padding:0 2px}.footnote{font-size:8px}}
@media(max-width:360px){.life-zone{grid-template-columns:40px minmax(0,1fr) 40px}.life-number{font-size:49px}.mast-id{display:none}.status{font-size:9px}}
@media(orientation:landscape) and (max-height:510px){.board.tabletop{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}.board.tabletop.four{grid-template-columns:repeat(2,minmax(0,1fr))}.board.tabletop .player,.board.tabletop.four .player{min-height:138px}.board.tabletop .life-zone,.board.tabletop.four .life-zone{min-height:65px}.board.tabletop.four .life-number{font-size:clamp(34px,9vh,55px)}.masthead{min-height:49px;grid-template-columns:12px 1fr}.mast-core{grid-template-rows:26px 6px 12px;gap:2px}.mast-title{font-size:13px;border-radius:0 8px 0 0}.mast-sub{font-size:8px}.app{gap:5px}.pill{min-height:30px;padding:6px 9px}.player{min-height:135px}.life-zone{min-height:68px}.life-number{font-size:clamp(40px,8vh,70px)}.player-footer{padding:3px 6px 5px}.micro{min-height:24px}.player-header{padding:4px 7px 0}.player:before{height:4px}.rail{height:12px}.bottom{gap:3px}}
</style>
</head>
<body>
<div class="app">
 <header class="masthead"><div class="mast-rail"></div><div class="mast-core"><div class="mast-title"><span>LCARS // LIFE SUPPORT</span><span class="mast-id">MTG · 47-A</span></div><div class="mast-stripes"><span></span><span></span><span></span></div><div class="mast-sub"><span>TACTICAL STATUS / DUEL COMMAND</span><span id="clock">STARDATE 01</span></div></div></header>
 <nav class="toolbar" aria-label="Tracker controls"><button class="pill active" data-mode="2">2 PLAYERS</button><button class="pill" data-mode="4">4 PLAYERS</button><button class="pill alt" id="modeBtn">20 LIFE</button><button class="pill active" id="layoutBtn" aria-label="Switch between tabletop and console layouts" aria-pressed="true">⇅ TABLETOP</button><button class="pill" id="undoBtn" aria-label="Undo last change">↶ UNDO</button><button class="pill" id="resetBtn">NEW GAME</button><span class="grow"></span><span class="status">LOCAL</span></nav>
 <main class="board" id="board" aria-label="Players and life totals"></main>
 <div class="bottom"><div class="rail"><span></span><span></span><span></span></div><div class="footnote">OFFLINE READY · LCARS 24.12</div></div>
</div>
<div id="backdrop" class="dialog-backdrop" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions" id="dialogActions"></div></div></div>
<script>
(()=>{'use strict';
const STORE='lcars-mtg-v1';
const makePlayers=()=>Array.from({length:4},(_,i)=>({name:['PLAYER ONE','PLAYER TWO','PLAYER THREE','PLAYER FOUR'][i],life:20,poison:0,commander:[0,0,0,0]}));
const defaultState=()=>({count:2,startingLife:20,layout:"tabletop",players:makePlayers()});
let state=defaultState(),history=[];
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&[2,4].includes(saved.count)&&[20,40].includes(saved.startingLife)&&Array.isArray(saved.players)&&saved.players.length===4){state=saved;state.layout=state.layout==="console"?"console":"tabletop";state.players=state.players.map((p,i)=>({name:String(p.name||'PLAYER '+(i+1)).slice(0,22),life:Number.isFinite(p.life)?p.life:state.startingLife,poison:Number.isFinite(p.poison)?p.poison:0,commander:Array.isArray(p.commander)?Array.from({length:4},(_,j)=>Number(p.commander[j])||0):[0,0,0,0]}));}}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}};
function push(){history.push(JSON.stringify(state));if(history.length>100)history.shift()}
function update(fn){push();fn();save();render()}
function render(){const board=$('board');board.className='board '+(state.count===4?'four ':'')+(state.layout==='tabletop'?'tabletop':'console');board.innerHTML=state.players.slice(0,state.count).map((p,i)=>{
const lethal=state.startingLife===40&&p.commander.some(v=>v>=21),dead=p.life<=0||p.poison>=10||lethal;
return `<section class="player" data-player="${i}"><div class="player-header"><input class="player-name" aria-label="Player ${i+1} name" maxlength="22" value="${esc(p.name)}" data-name="${i}" spellcheck="false"><span class="player-code">UNIT 0${i+1} ${dead?'· CRITICAL':'· ACTIVE'}</span></div><div class="life-zone"><button class="life-control minus" data-life="${i}" data-delta="-1" aria-label="Subtract one life from ${esc(p.name)}">−</button><div class="life-center"><span class="life-label">LIFE</span><span class="life-number ${dead?'dead':p.life<=5?'danger':''}" aria-live="polite">${p.life}</span></div><button class="life-control plus" data-life="${i}" data-delta="1" aria-label="Add one life to ${esc(p.name)}">+</button></div><div class="player-footer"><button class="micro" data-adjust="${i}">± 5 / 10</button><button class="micro ${p.poison?'poisoned':''}" data-poison="${i}">☣ ${p.poison} POISON</button>${state.startingLife===40?`<button class="micro damage" data-cmd="${i}">CMD DMG</button>`:''}</div></section>`}).join('');
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',Number(b.dataset.mode)===state.count));$('modeBtn').textContent=state.startingLife+' LIFE'+(state.startingLife===40?' · CMD':'');$('layoutBtn').textContent=state.layout==='tabletop'?'⇅ TABLETOP':'▤ CONSOLE';$('layoutBtn').classList.toggle('active',state.layout==='tabletop');$('layoutBtn').setAttribute('aria-pressed',String(state.layout==='tabletop'));$('undoBtn').disabled=history.length===0;$('undoBtn').style.opacity=history.length?'1':'.45';}
$('board').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.life!==undefined){const i=+d.life,delta=+d.delta;update(()=>state.players[i].life+=delta)}else if(d.adjust!==undefined)showAdjust(+d.adjust);else if(d.poison!==undefined)showPoison(+d.poison);else if(d.cmd!==undefined)showCommander(+d.cmd)});
$('board').addEventListener('change',e=>{if(e.target.dataset.name!==undefined){let i=+e.target.dataset.name;update(()=>state.players[i].name=e.target.value.trim().slice(0,22)||'PLAYER '+(i+1))}});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>update(()=>state.count=+b.dataset.mode)));
$('layoutBtn').addEventListener('click',()=>update(()=>state.layout=state.layout==='tabletop'?'console':'tabletop'));
$('modeBtn').addEventListener('click',()=>{const next=state.startingLife===20?40:20;showDialog('GAME FORMAT',`<p>Change to ${next}-life ${next===40?'Commander':'standard'} format? This starts a new game and clears all life, poison, and commander damage totals. Player names are preserved.</p>`,[{text:'CANCEL',close:true},{text:'CONFIRM',primary:true,fn:()=>update(()=>{state.startingLife=next;state.players.forEach(p=>{p.life=next;p.poison=0;p.commander=[0,0,0,0]})})}])});
$('undoBtn').addEventListener('click',()=>{if(!history.length)return;state=JSON.parse(history.pop());save();render()});
$('resetBtn').addEventListener('click',()=>showDialog('NEW GAME',`<p>Reset life totals to ${state.startingLife}, poison to zero, and all commander damage to zero? Player names and game format stay the same.</p>`,[{text:'CANCEL',close:true},{text:'RESET',primary:true,fn:()=>update(()=>state.players.forEach(p=>{p.life=state.startingLife;p.poison=0;p.commander=[0,0,0,0]}))}]));
const backdrop=$('backdrop');function close(){backdrop.classList.remove('show')};function showDialog(title,body,actions){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogActions').innerHTML='';actions.forEach(a=>{let b=document.createElement('button');b.className='pill '+(a.primary?'active':'');b.textContent=a.text;b.addEventListener('click',()=>{if(a.fn)a.fn();if(a.close||a.primary)close()});$('dialogActions').append(b)});backdrop.classList.add('show')}
backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function showAdjust(i){showDialog('LIFE ADJUSTMENT · '+state.players[i].name,`<p>Rapid life correction for player ${i+1}.</p><div class="damage-grid">${[-10,-5,5,10].map(n=>`<button class="pill ${n>0?'active':'alt'}" data-quick="${n}">${n>0?'+':''}${n} LIFE</button>`).join('')}</div>`,[{text:'DONE',close:true}]);$('dialogBody').querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.quick;update(()=>state.players[i].life+=n);close()}))}
function showPoison(i){let p=state.players[i];showDialog('POISON · '+p.name,`<p>Ten poison counters eliminate a player.</p><div class="damage-card"><strong>POISON COUNTERS</strong><div class="stepper"><button id="poisonMinus" aria-label="Remove poison counter">−</button><span id="poisonValue">${p.poison}</span><button id="poisonPlus" aria-label="Add poison counter">+</button></div></div>`,[{text:'DONE',close:true}]);$('poisonMinus').addEventListener('click',()=>{update(()=>p.poison=Math.max(0,p.poison-1));$('poisonValue').textContent=p.poison});$('poisonPlus').addEventListener('click',()=>{update(()=>p.poison++);$('poisonValue').textContent=p.poison})}
function showCommander(target){const p=state.players[target];const entries=state.players.slice(0,state.count).map((source,i)=>i===target?'':`<div class="damage-card"><strong>FROM ${esc(source.name)}</strong><div class="stepper"><button data-cmd-step="${i}" data-dir="-1" aria-label="Remove commander damage from ${esc(source.name)}">−</button><span data-cmd-val="${i}">${p.commander[i]}</span><button data-cmd-step="${i}" data-dir="1" aria-label="Add commander damage from ${esc(source.name)}">+</button></div></div>`).join('');showDialog('COMMANDER DAMAGE · '+p.name,`<p>Combat damage dealt to this player by each opposing commander. At 21 damage from any single commander, this player loses. Adjusting this tracker does not automatically change life.</p><div class="damage-grid">${entries}</div>`,[{text:'DONE',close:true}]);$('dialogBody').querySelectorAll('[data-cmd-step]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.cmdStep,dir=+b.dataset.dir;update(()=>p.commander[i]=Math.max(0,p.commander[i]+dir));$('dialogBody').querySelector(`[data-cmd-val="${i}"]`).textContent=p.commander[i]}))}
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
</body>
</html>
