<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#090b16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LCARS Life" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>LCARS // MTG Life Support</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b16;
        --surface: #121527;
        --edge: #26283c;
        --peach: #ffb789;
        --orange: #fa976b;
        --lav: #bca5f9;
        --pink: #e994bd;
        --blue: #98c7fa;
        --mint: #96dfc8;
        --ink: #161222;
        --muted: #a4a5bc;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: #f4ecfa;
        font-family: Arial, Helvetica, sans-serif;
        overscroll-behavior: none;
      }
      button,
      input,
      select {
        font: inherit;
      }
      /* Buttons never hand a touch to the browser as a pan, so a finger that drifts
         while lifting can't cancel the press. The menu scrolls, so its buttons still allow it. */
      button {
        touch-action: none;
        cursor: pointer;
      }
      .menu button {
        touch-action: manipulation;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }
      button:active {
        filter: brightness(1.2);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .app {
        width: min(100%, 1000px);
        margin: 0 auto;
        padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right))
          max(22px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .masthead {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 5px;
        min-height: 93px;
      }
      .mast-rail {
        background: var(--lav);
        border-radius: 18px 0 0 0;
      }
      .mast-core {
        display: grid;
        grid-template-rows: 49px 14px 24px;
        gap: 3px;
      }
      .mast-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        background: var(--peach);
        border-radius: 0 18px 0 0;
        padding: 0 14px;
        color: var(--ink);
        font-weight: 900;
        letter-spacing: 0.12em;
        font-size: clamp(16px, 3.5vw, 27px);
      }
      .mast-id {
        font-size: 10px;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .mast-stripes {
        display: flex;
        gap: 5px;
      }
      .mast-stripes span:nth-child(1) {
        width: 20%;
        background: var(--pink);
      }
      .mast-stripes span:nth-child(2) {
        width: 11%;
        background: var(--bg);
      }
      .mast-stripes span:nth-child(3) {
        flex: 1;
        background: var(--lav);
      }
      .mast-sub {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--blue);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .toolbar {
        display: flex;
        gap: 7px;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .pill {
        border: 0;
        border-radius: 13px;
        padding: 12px 13px;
        background: var(--edge);
        color: var(--blue);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        min-height: 42px;
      }
      .pill.active {
        background: var(--lav);
        color: var(--ink);
      }
      .pill.alt {
        background: #343049;
        color: var(--peach);
      }
      .grow {
        flex: 1;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .status:before {
        content: "";
        height: 8px;
        width: 8px;
        background: var(--mint);
        border-radius: 50%;
        box-shadow: 0 0 10px #96dfc866;
      }
      .lcars-btn {
        display: inline-flex;
        align-items: stretch;
        gap: 3px;
        border: 0;
        padding: 0;
        background: none;
        min-height: 44px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .lcars-btn span {
        display: flex;
        align-items: center;
      }
      .lcars-cap {
        width: 22px;
        background: var(--orange);
        border-radius: 22px 0 0 22px;
      }
      .lcars-label {
        flex: 1;
        justify-content: flex-end;
        background: var(--peach);
        padding: 0 14px;
      }
      .lcars-code {
        background: var(--lav);
        padding: 0 12px 0 9px;
        border-radius: 0 22px 22px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .menu-backdrop {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
        background: #000b;
      }
      .menu-backdrop.show {
        display: flex;
      }
      .menu {
        --rail: 26px;
        width: min(100%, 440px);
        max-height: 100%;
        overflow: auto;
        background: var(--lav);
        border-radius: 26px 18px 18px 26px;
        box-shadow: 0 20px 100px #000;
      }
      .menu-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--peach);
        padding: 6px 6px 6px 22px;
      }
      .menu-head h2 {
        margin: 0;
        color: var(--ink);
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.12em;
      }
      .menu-close {
        border: 0;
        min-height: 44px;
        padding: 0 16px;
        background: var(--ink);
        color: var(--peach);
        border-radius: 9px 16px 9px 9px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }
      .menu-body {
        display: grid;
        gap: 12px;
        margin-left: var(--rail);
        padding: 16px 14px;
        background: #0d0f1e;
        border-radius: 16px 0 0 16px;
      }
      .player > .life-zone:last-child {
        padding-bottom: 8px !important;
      }
      .menu-row {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }
      .menu-label {
        color: var(--blue);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .menu-opts {
        display: flex;
        gap: 6px;
      }
      .menu-opts .pill {
        flex: 1;
        min-width: 0;
        min-height: 46px;
        padding: 0 6px;
      }
      .pill.warn {
        min-height: 48px;
        background: var(--orange);
        color: var(--ink);
      }
      .menu-foot {
        height: 14px;
        background: var(--pink);
      }
      .board {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        flex: 1;
        align-content: stretch;
      }
      .board.solo {
        grid-template-columns: 1fr;
      }
      .board.tabletop {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      .board.tabletop.four {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }
      .board.tabletop .player:first-child {
        transform: rotate(180deg);
      }
      .board.tabletop.four .player:nth-child(2) {
        transform: rotate(180deg);
      }
      .board.four {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .player {
        --accent: var(--orange);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        min-height: 265px;
        background: linear-gradient(145deg, #171a2d, #101221);
        border: 1px solid #393146;
        border-radius: 18px 9px 18px 9px;
      }
      .player:before {
        content: "";
        height: 8px;
        background: var(--accent);
        width: 100%;
        display: block;
      }
      .player-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        padding: 9px 10px 0;
      }
      .player-name {
        border: 0;
        background: transparent;
        min-width: 0;
        max-width: 75%;
        font-weight: 800;
        font-size: clamp(12px, 2.2vw, 17px);
        letter-spacing: 0.08em;
        color: var(--accent);
        text-transform: uppercase;
        outline: none;
        border-bottom: 1px dotted #56566e;
        border-radius: 0;
        padding: 3px 0;
      }
      .player-name:focus {
        border-bottom-color: white;
      }
      .player-code {
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 0.09em;
        white-space: nowrap;
      }
      .life-zone {
        display: grid;
        grid-template-columns: minmax(58px, 1fr) minmax(0, 1.45fr) minmax(58px, 1fr);
        align-items: stretch;
        gap: 4px;
        min-height: 150px;
        flex: 1;
        padding: 8px 8px 2px;
      }
      .life-control {
        border: 0;
        color: var(--ink);
        border-radius: 9px;
        background: var(--accent);
        font-size: clamp(27px, 7vw, 45px);
        font-weight: 800;
        min-width: 0;
      }
      .life-control.minus {
        background: #38344f;
        color: #ffb5af;
      }
      .life-center {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }
      .tally {
        --tally: var(--lav);
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 1;
        display: flex;
        gap: 2px;
        height: 20px;
        line-height: 20px;
        color: var(--ink);
        font-weight: 900;
        white-space: nowrap;
        pointer-events: none;
        transform: translateX(-50%);
        animation:
          tally-in 140ms ease-out,
          tally-out 240ms linear 1760ms forwards;
      }
      .tally.gain {
        --tally: var(--mint);
      }
      .tally.loss {
        --tally: #ff7b90;
      }
      .tally-cap,
      .tally-value {
        background: var(--tally);
      }
      .tally-cap {
        padding: 0 5px 0 9px;
        border-radius: 10px 0 0 10px;
        font-size: 9px;
        letter-spacing: 0.12em;
      }
      .tally-value {
        min-width: 30px;
        padding: 0 9px 0 5px;
        border-radius: 0 10px 10px 0;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      @keyframes tally-in {
        from {
          filter: brightness(1.5);
        }
      }
      @keyframes tally-out {
        to {
          opacity: 0;
        }
      }
      .life-label {
        font-size: 9px;
        letter-spacing: 0.3em;
        color: var(--muted);
        font-weight: 800;
      }
      .life-number {
        font-size: clamp(62px, 14vw, 110px);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.08em;
        font-variant-numeric: tabular-nums;
        padding-right: 0.08em;
        user-select: none;
      }
      .life-number.danger {
        color: #ff7b90;
      }
      .life-number.dead {
        color: #ff6677;
      }
      .player-footer {
        display: flex;
        gap: 5px;
        padding: 7px 8px 9px;
      }
      .micro {
        border: 0;
        background: #25263d;
        color: #d4c8ef;
        flex: 1;
        min-height: 37px;
        font-size: 11px;
        letter-spacing: 0.06em;
        font-weight: 800;
        border-radius: 7px;
      }
      .micro.poisoned {
        background: #3e344c;
        color: var(--mint);
      }
      .micro.damage {
        background: #35304b;
        color: var(--peach);
      }
      .player:nth-child(2) {
        --accent: var(--blue);
      }
      .player:nth-child(3) {
        --accent: var(--pink);
      }
      .player:nth-child(4) {
        --accent: var(--mint);
      }
      .board.tabletop .player {
        min-height: 240px;
      }
      .board.tabletop.four .player {
        min-height: 210px;
      }
      .board.tabletop .player-header {
        flex-shrink: 0;
      }
      .board.tabletop .life-zone {
        min-height: 110px;
      }
      .board.tabletop.four .life-zone {
        min-height: 95px;
      }
      .board.tabletop.four .life-number {
        font-size: clamp(44px, 12vw, 90px);
      }
      .board.tabletop.four .life-control {
        font-size: clamp(24px, 6vw, 42px);
      }
      .board.tabletop.four .player-footer {
        flex-wrap: wrap;
      }
      .board.tabletop.four .micro {
        min-height: 33px;
      }
      .board.tabletop .player-name {
        touch-action: auto;
      }
      .bottom {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }
      .rail {
        height: 44px;
        display: flex;
        gap: 4px;
      }
      .rail-btn {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        border: 0;
        padding: 0 12px 7px 18px;
        background: var(--peach);
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
      }
      .rail-btn:first-child {
        background: var(--lav);
        border-radius: 0 0 0 22px;
      }
      .rail > span {
        flex: 1;
        min-width: 14px;
        background: var(--pink);
        border-radius: 0 0 22px 0;
      }
      .footnote {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }
      .dialog-backdrop {
        position: fixed;
        inset: 0;
        background: #000b;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 14px;
      }
      .dialog-backdrop.show {
        display: flex;
      }
      .dialog {
        background: #171829;
        border: 2px solid var(--lav);
        border-radius: 18px;
        width: min(100%, 470px);
        padding: 18px;
        max-height: 90dvh;
        overflow: auto;
        box-shadow: 0 20px 100px #000;
      }
      .dialog h2 {
        font-size: 17px;
        margin: 0 0 8px;
        letter-spacing: 0.1em;
        color: var(--peach);
        text-transform: uppercase;
      }
      .dialog p {
        color: #c1bdd4;
        line-height: 1.5;
        font-size: 13px;
      }
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .dialog label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 12px 0;
        color: #ddd;
        font-size: 13px;
        gap: 12px;
      }
      .dialog input[type="number"] {
        width: 76px;
        background: #090b16;
        color: white;
        border: 1px solid #55516d;
        border-radius: 7px;
        padding: 9px;
      }
      .dialog select {
        background: #090b16;
        color: white;
        border: 1px solid #55516d;
        border-radius: 7px;
        padding: 9px;
        max-width: 170px;
      }
      .damage-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .damage-card {
        background: #25243a;
        padding: 10px;
        border-radius: 9px;
      }
      .damage-card strong {
        font-size: 12px;
        display: block;
        color: var(--blue);
        margin-bottom: 8px;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }
      .stepper button {
        border: 0;
        background: var(--lav);
        color: #1b1528;
        border-radius: 7px;
        width: 38px;
        height: 38px;
        font-size: 24px;
        font-weight: 800;
      }
      .stepper span {
        font-size: 23px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .tips {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
        margin: 6px 0;
      }
      .tiny {
        font-size: 11px;
        color: #bbb;
      }
      @media (min-width: 700px) {
        .app {
          gap: 15px;
        }
        .board {
          gap: 14px;
        }
        .player {
          min-height: 340px;
        }
        .life-zone {
          min-height: 200px;
        }
        .player-footer {
          padding: 10px;
        }
        .micro {
          min-height: 45px;
        }
        .pill {
          font-size: 13px;
        }
      }
      @media (max-width: 699px) and (orientation: portrait) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }
        .app {
          height: 100vh;
          height: 100dvh;
          min-height: 0;
          gap: 6px;
          padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
            max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        }
        .masthead {
          flex: none;
          min-height: 0;
          grid-template-columns: 16px minmax(0, 1fr);
          gap: 4px;
        }
        .mast-core {
          grid-template-rows: 34px 7px 14px;
          gap: 2px;
        }
        .mast-title {
          font-size: clamp(14px, 4.4vw, 18px);
          letter-spacing: 0.06em;
          padding: 0 10px;
          white-space: nowrap;
        }
        .mast-id {
          font-size: 9px;
        }
        .mast-sub {
          font-size: 9px;
          letter-spacing: 0.08em;
          white-space: nowrap;
        }
        .toolbar {
          flex: none;
          flex-wrap: nowrap;
          gap: 6px;
        }
        .grow {
          display: none;
        }
        .lcars-btn {
          flex: 1;
          min-width: 0;
        }
        .pill {
          font-size: 11px;
          min-height: 44px;
          padding: 0 11px;
        }
        .status {
          font-size: 9px;
          letter-spacing: 0.06em;
        }
        .board,
        .board.tabletop {
          min-height: 0;
          gap: 6px;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: repeat(2, minmax(0, 1fr));
        }
        .board.four,
        .board.tabletop.four {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .player,
        .board.tabletop .player,
        .board.tabletop.four .player {
          min-height: 0;
          container-type: size;
        }
        .player:before {
          height: 6px;
          flex: none;
        }
        .player-header {
          padding: 6px 8px 0;
        }
        .player-name {
          flex: 1;
          max-width: none;
          font-size: 16px;
          letter-spacing: 0.04em;
        }
        .player-code {
          font-size: 8px;
        }
        .life-zone,
        .board.tabletop .life-zone,
        .board.tabletop.four .life-zone {
          min-height: 0;
          gap: 4px;
          padding: 6px 6px 0;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr);
        }
        .life-control,
        .board.tabletop.four .life-control {
          font-size: clamp(28px, 11cqw, 44px);
        }
        .life-label {
          font-size: 8px;
          letter-spacing: 0.24em;
        }
        .life-number,
        .board.tabletop.four .life-number {
          font-size: calc(min(33cqw, 46cqh) * var(--s, 1));
          letter-spacing: -0.05em;
          line-height: 1;
        }
        .life-number.len3 {
          --s: 0.64;
        }
        .life-number.len4 {
          --s: 0.52;
        }
        .player-footer {
          flex: none;
          flex-wrap: nowrap;
          padding: 6px;
        }
        .micro,
        .board.tabletop.four .micro {
          min-height: 40px;
          min-width: 0;
          padding: 0 2px;
          font-size: 11px;
        }
        .board.four .player-code {
          display: none;
        }
        .board.four .word {
          display: none;
        }
        .board.four .player-header {
          padding: 5px 6px 0;
        }
        .board.four .player-name {
          font-size: 15px;
        }
        .board.four .player-footer {
          gap: 3px;
          padding: 5px 4px;
        }
        .board.four .micro {
          white-space: nowrap;
          font-size: 10px;
          letter-spacing: 0.02em;
        }
        .board.four .life-zone,
        .board.tabletop.four .life-zone {
          gap: 3px;
          padding: 5px 4px 0;
          grid-template-columns: minmax(38px, 1fr) minmax(0, 1.6fr) minmax(38px, 1fr);
        }
        .board.four .life-number,

      .viewer {
        position: fixed;
        inset: 0;

        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))

        grid-template-columns: minmax(0, 1fr) 200px;

      .viewer-stage {
        position: relative;

        background:
          linear-gradient(#26283c55 1px, transparent 1px) 0 0/100% 32px,
          linear-gradient(90deg, #26283c55 1px, transparent 1px) 0 0/32px 100%,
          #0b0d1b;

      .blueprint,
      #earthCanvas {
        position: absolute;
        inset: 0;
        display: none;

        height: 100%;

      .blueprint {
        object-fit: contain;

      .scan {

      .viewer-stage.earth .scan {

        align-content: start;
        gap: 6px;

      .readouts div {

        background: #171829;
        border-left: 6px solid var(--accent, var(--orange));

      @keyframes scan {

          transform: translateX(-80px);
        }

          transform: translateX(1200px);
        }
      }
      @media (max-width: 699px) and (orientation: portrait) {
        .viewer-frame {
          --rail: 14px;

        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scan {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <div class="mast-rail"></div>
        <div class="mast-core">
          <div class="mast-title">
            <span>LCARS // LIFE SUPPORT</span>
            <span class="mast-id">MTG · 47-A</span>
          </div>
          <div class="mast-stripes">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="mast-sub">
            <span>
              <span class="mast-extra">TACTICAL STATUS /</span>
              DUEL COMMAND
            </span>
            <span id="clock"></span>
          </div>
        </div>
      </header>
      <nav class="toolbar" aria-label="Tracker controls">
        <button
          class="lcars-btn"
          id="menuBtn"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="menu"
        >
          <span class="lcars-cap"></span>
          <span class="lcars-label">CONTROL</span>
          <span class="lcars-code">47</span>
        </button>
        <button class="pill" id="undoBtn" aria-label="Undo last change">↶ UNDO</button>
        <span class="grow"></span>
        <span class="status" id="summary"></span>
      </nav>
      <main class="board" id="board" aria-label="Players and life totals"></main>
      <div class="bottom">
        <div class="rail">
          <button class="rail-btn" data-open-view="blueprint">SCHEMATIC</button>
          <button class="rail-btn" data-open-view="earth">EARTH</button>
          <span></span>
        </div>
        <div class="footnote">OFFLINE READY · LCARS 24.12</div>
      </div>
    </div>
    <div id="menuBackdrop" class="menu-backdrop" role="presentation">
      <div class="menu" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
        <div class="menu-head">
          <h2 id="menuTitle">CONTROL // 47</h2>
          <button class="menu-close" id="menuClose">CLOSE</button>
        </div>
        <div class="menu-body">
          <div class="menu-row">
            <span class="menu-label">Players</span>
            <div class="menu-opts">
              <button class="pill" data-mode="2">2 PLAYERS</button>
              <button class="pill" data-mode="4">4 PLAYERS</button>
            </div>
          </div>
          <div class="menu-row">
            <span class="menu-label">Format</span>
            <div class="menu-opts"><button class="pill alt" id="modeBtn">20 LIFE</button></div>
          </div>
          <div class="menu-row">
            <span class="menu-label">Layout</span>
            <div class="menu-opts">
              <button
                class="pill active"
                id="layoutBtn"
                aria-label="Switch between tabletop and console layouts"
                aria-pressed="true"
              >
                ⇅ TABLETOP
              </button>
            </div>
          </div>
          <div class="menu-row">
            <span class="menu-label">Options</span>
            <div class="menu-opts">
              <button
                class="pill"
                id="advancedBtn"
                aria-label="Advanced mode: poison counters and five or ten life adjustments"
                aria-pressed="false"
              >
                ADVANCED
              </button>
              <button class="pill" id="soundBtn" aria-label="Sound effects" aria-pressed="true">
                SOUND
              </button>
            </div>
          </div>
          <button class="pill warn" id="resetBtn">NEW GAME</button>
        </div>
        <div class="menu-foot"></div>
      </div>
    </div>
    <div id="backdrop" class="dialog-backdrop" role="presentation">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <h2 id="dialogTitle"></h2>
        <div id="dialogBody"></div>
        <div class="dialog-actions" id="dialogActions"></div>
      </div>
    </div>
    <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="viewer-frame">
        <div class="viewer-head">
          <h2 id="viewerTitle"></h2>
          <button class="menu-close" id="viewerClose">EXIT</button>
        </div>
        <div class="viewer-main">
          <div class="viewer-stage">
            <img
              class="blueprint"
              id="blueprintImg"
              data-view="blueprint"
              src="blueprint.webp"
              alt="Starship blueprint with labeled top, bottom, and side views. Pinch or double-tap to zoom."
              loading="lazy"
              draggable="false"
            />
            <canvas
              id="earthCanvas"
              data-view="earth"
              role="img"
              aria-label="Rotating wireframe globe of Earth. Drag to turn it."
            ></canvas>
            <span class="scan" aria-hidden="true"></span>
          </div>
          <dl class="readouts" id="readouts"></dl>
        </div>
        <div class="viewer-tabs">
          <button class="pill" data-tab="blueprint">BLUEPRINT</button>
          <button class="pill" data-tab="earth">EARTH</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        "use strict";
        const STORE = "lcars-mtg-v2";
        const PLAYER_NAMES = ["PLAYER ONE", "PLAYER TWO", "PLAYER THREE", "PLAYER FOUR"],
          TEAM_NAMES = ["TEAM ONE", "TEAM TWO"],
          FORMATS = [20, 30, 40],
          formatName = (life) =>
            life + " LIFE" + (life === 40 ? " · CMD" : life === 30 ? " · 2HG" : "");
        const makePlayers = () =>
          Array.from({ length: 4 }, (_, i) => ({
            name: PLAYER_NAMES[i],
            life: 20,
            poison: 0,
            commander: [0, 0, 0, 0],
          }));
        const defaultState = () => ({
          count: 2,
          startingLife: 20,
          layout: "tabletop",
          advanced: false,
          players: makePlayers(),
        });
        let state = defaultState(),
          history = [];
        try {
          const saved = JSON.parse(localStorage.getItem(STORE));
          if (
            saved &&
            [2, 4].includes(saved.count) &&
            FORMATS.includes(saved.startingLife) &&
            Array.isArray(saved.players) &&
            saved.players.length === 4
          ) {
            state = saved;
            state.layout = state.layout === "console" ? "console" : "tabletop";
            state.advanced = state.advanced === true;
            state.players = state.players.map((p, i) => ({
              name: String(p.name || "PLAYER " + (i + 1)).slice(0, 22),
              life: Number.isFinite(p.life) ? p.life : state.startingLife,
              poison: Number.isFinite(p.poison) ? p.poison : 0,
              commander: Array.isArray(p.commander)
                ? Array.from({ length: 4 }, (_, j) => Number(p.commander[j]) || 0)
                : [0, 0, 0, 0],
            }));
          }
        } catch (e) {}
        const $ = (id) => document.getElementById(id),
          esc = (s) =>
            String(s).replace(
              /[&<>"']/g,
              (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
            );
        function save() {
          try {
            localStorage.setItem(STORE, JSON.stringify(state));
          } catch (e) {}
        }
        function push() {
          history.push(JSON.stringify(state));
          if (history.length > 100) history.shift();
        }
        function update(fn) {
          push();
          fn();
          save();
          render();
        }
        // Two-Headed Giant: two teams, each sharing one life total and one poison count.
        const twoHeaded = () => state.startingLife === 30,
          defaultName = (i) => (twoHeaded() && TEAM_NAMES[i]) || PLAYER_NAMES[i];
        function vitals(p, i) {
          const lethal = state.startingLife === 40 && p.commander.some((v) => v >= 21),
            dead = p.life <= 0 || p.poison >= (twoHeaded() ? 15 : 10) || lethal;
          return {
            code: `UNIT 0${i + 1} ${dead ? "· CRITICAL" : "· ACTIVE"}`,
            lifeClass: `life-number len${String(p.life).length} ${dead ? "dead" : p.life <= 5 ? "danger" : ""}`,
          };
        }
        function paintUndo() {
          $("undoBtn").disabled = history.length === 0;
          $("undoBtn").style.opacity = history.length ? "1" : ".45";
        }
        // Life changes patch the existing player card instead of rebuilding the board,
        // so the pressed button's light and the running total survive the update.
        const tallies = [];
        function changeLife(i, delta) {
          push();
          const p = state.players[i];
          p.life += delta;
          save();
          const card = $("board").querySelector(`[data-player="${i}"]`),
            number = card.querySelector(".life-number"),
            { code, lifeClass } = vitals(p, i);
          number.textContent = p.life;
          number.className = lifeClass;
          card.querySelector(".player-code").textContent = code;
          paintUndo();
          showTally(i, card.querySelector(".life-center"), delta);
        }
        function showTally(i, center, delta) {
          const tally = (tallies[i] ||= { total: 0 });
          tally.total += delta;
          clearTimeout(tally.timer);
          const total = tally.total,
            tone = total > 0 ? "gain" : total < 0 ? "loss" : "",
            text = total > 0 ? "+" + total : total < 0 ? "−" + -total : "±0";
          // A new element restarts the fade, so it stays solid until two seconds after this press.
          center.querySelector(".tally")?.remove();
          center.insertAdjacentHTML(
            "beforeend",
            `<span class="tally ${tone}" aria-hidden="true"><span class="tally-cap">NET</span><span class="tally-value">${text}</span></span>`,
          );
          tally.timer = setTimeout(() => {
            center.querySelector(".tally")?.remove();
            delete tallies[i];
          }, 2000);
        }
        function render() {
          tallies.forEach((tally) => clearTimeout(tally.timer));
          tallies.length = 0;
          const board = $("board");
          board.className =
            "board " +
            (state.count === 4 ? "four " : "") +
            (state.layout === "tabletop" ? "tabletop" : "console");
          board.innerHTML = state.players
            .slice(0, state.count)
            .map((p, i) => {
              const { code, lifeClass } = vitals(p, i);
              const advancedTools = state.advanced
                ? `<button class="micro" data-adjust="${i}">± 5 / 10</button><button class="micro ${p.poison ? "poisoned" : ""}" data-poison="${i}" aria-label="Poison counters for ${esc(p.name)}: ${p.poison}">☣ ${p.poison}<span class="word"> POISON</span></button>`
                : "";
              const commanderTool =
                state.startingLife === 40
                  ? `<button class="micro damage" data-cmd="${i}" aria-label="Commander damage for ${esc(p.name)}">CMD<span class="word"> DMG</span></button>`
                  : "";
              const tools = advancedTools + commanderTool;
              return `<section class="player" data-player="${i}"><div class="player-header"><input class="player-name" aria-label="Player ${i + 1} name" maxlength="22" value="${esc(p.name)}" data-name="${i}" spellcheck="false"><span class="player-code">${code}</span></div><div class="life-zone"><button class="life-control minus" data-life="${i}" data-delta="-1" aria-label="Subtract one life from ${esc(p.name)}">−</button><div class="life-center"><span class="life-label">LIFE</span><span class="${lifeClass}" aria-live="polite">${p.life}</span></div><button class="life-control plus" data-life="${i}" data-delta="1" aria-label="Add one life to ${esc(p.name)}">+</button></div>${tools ? `<div class="player-footer">${tools}</div>` : ""}</section>`;
            })
            .join("");
          document
            .querySelectorAll("[data-mode]")
            .forEach((b) => {
              b.classList.toggle("active", Number(b.dataset.mode) === state.count);
              b.disabled = twoHeaded() && b.dataset.mode === "4";
            });
          $("modeBtn").textContent = formatName(state.startingLife);
          $("layoutBtn").textContent = state.layout === "tabletop" ? "⇅ TABLETOP" : "▤ CONSOLE";
          $("layoutBtn").classList.toggle("active", state.layout === "tabletop");
          $("layoutBtn").setAttribute("aria-pressed", String(state.layout === "tabletop"));
          $("advancedBtn").classList.toggle("active", state.advanced);
          $("advancedBtn").setAttribute("aria-pressed", String(state.advanced));
          $("summary").textContent =
            (twoHeaded() ? "2HG" : state.count + "P") + " · " + state.startingLife + " LIFE";
          paintUndo();
        }
        $("board").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          const d = b.dataset;
          if (d.life !== undefined) {
            changeLife(+d.life, +d.delta);
          } else if (d.adjust !== undefined) showAdjust(+d.adjust);
          else if (d.poison !== undefined) showPoison(+d.poison);
          else if (d.cmd !== undefined) showCommander(+d.cmd);
        });
        $("board").addEventListener("change", (e) => {
          if (e.target.dataset.name !== undefined) {
            let i = +e.target.dataset.name;
            update(
              () =>
                (state.players[i].name = e.target.value.trim().slice(0, 22) || defaultName(i)),
            );
          }
        });
        document
          .querySelectorAll("[data-mode]")
          .forEach((b) =>
            b.addEventListener("click", () => update(() => (state.count = +b.dataset.mode))),
          );
        $("advancedBtn").addEventListener("click", () =>
          update(() => (state.advanced = !state.advanced)),
        );
        $("layoutBtn").addEventListener("click", () =>
          update(() => (state.layout = state.layout === "tabletop" ? "console" : "tabletop")),
        );
        $("modeBtn").addEventListener("click", () => {
          closeMenu(false);
          const startFormat = (next) =>
            update(() => {
              state.startingLife = next;
              if (twoHeaded()) state.count = 2;
              state.players.forEach((p, i) => {
                if (p.name === PLAYER_NAMES[i] || p.name === TEAM_NAMES[i]) p.name = defaultName(i);
                p.life = next;
                p.poison = 0;
                p.commander = [0, 0, 0, 0];
              });
            });
          showDialog(
            "GAME FORMAT",
            `<p>Choose a format: 20 life standard, 30 life Two-Headed Giant (two teams, each sharing one life total and 15 poison), or 40 life Commander. This starts a new game and clears all life, poison, and commander damage totals. Custom names are preserved.</p>`,
            [
              { text: "CANCEL", close: true },
              ...FORMATS.filter((life) => life !== state.startingLife).map((life) => ({
                text: formatName(life),
                primary: true,
                fn: () => startFormat(life),
              })),
            ],
          );
        });
        $("undoBtn").addEventListener("click", () => {
          if (!history.length) return;
          state = JSON.parse(history.pop());
          save();
          render();
        });
        $("resetBtn").addEventListener("click", () => {

            y = cy - ((cy - y) * next) / scale;
            scale = next;
            apply();
          }
          const local = (e) => {
            const box = img.parentElement.getBoundingClientRect();
            return [e.clientX - box.left, e.clientY - box.top];
          };
          const spread = () => {
            const [a, b] = [...pointers.values()];
            return {
              size: Math.hypot(a[0] - b[0], a[1] - b[1]),
              x: (a[0] + b[0]) / 2,
              y: (a[1] + b[1]) / 2,
            };
          };
          img.addEventListener("pointerdown", (e) => {
            img.setPointerCapture(e.pointerId);
            const at = local(e);
            pointers.set(e.pointerId, at);
            if (pointers.size === 2) {
              pinch = spread();
              lastTap = 0;
            } else if (pointers.size === 1) {
              const now = performance.now();
              if (now - lastTap < 300) {
                zoomAt(at[0], at[1], scale > 1 ? 1 : DOUBLE_TAP_ZOOM);
                lastTap = 0;
              } else {
                lastTap = now;
              }
            }
          });
          img.addEventListener("pointermove", (e) => {
            const from = pointers.get(e.pointerId);
            if (!from) return;
            const at = local(e);
            pointers.set(e.pointerId, at);
            if (pointers.size === 1) {
              x += at[0] - from[0];
              y += at[1] - from[1];
              apply();
            } else if (pinch && pointers.size === 2) {
              const now = spread();
              x += now.x - pinch.x;
              y += now.y - pinch.y;
              zoomAt(now.x, now.y, (scale * now.size) / pinch.size);
              pinch = now;
            }
          });
          const release = (e) => {
            pointers.delete(e.pointerId);
            pinch = null;
          };
          img.addEventListener("pointerup", release);
          img.addEventListener("pointercancel", release);
          img.addEventListener(
            "wheel",
            (e) => {
              e.preventDefault();
              const at = local(e);
              zoomAt(at[0], at[1], scale * Math.exp(-e.deltaY * 0.002));
            },
            { passive: false },
          );
          return {
            reset() {
              scale = 1;
              x = 0;
              y = 0;
              pointers.clear();
              pinch = null;
              apply();
            },
          };
        })();

        // Year plus day of the year, so 3 Nov 2026 reads 2026.307, then local 24-hour time.
        function stardate(now) {
          const y = now.getFullYear(),
            day = (Date.UTC(y, now.getMonth(), now.getDate()) - Date.UTC(y, 0, 0)) / 864e5,
            pad = (n, width) => String(n).padStart(width, "0");
          return `STARDATE ${y}.${pad(day, 3)} · ${pad(now.getHours(), 2)}:${pad(now.getMinutes(), 2)}`;
        }
        function tickClock() {
          const text = stardate(new Date());
          if ($("clock").textContent !== text) $("clock").textContent = text;
        }
        tickClock();
        setInterval(tickClock, 1000);
        render();

        // Keep the screen awake while the tracker is visible. The browser drops the
        // lock whenever the page is hidden, so re-request it on return and on taps
        // (some browsers only grant it after a user gesture).
        if ("wakeLock" in navigator) {
          let wakeLock = null;
          const requestWakeLock = async () => {
            if (wakeLock || document.visibilityState !== "visible") return;
            try {
              wakeLock = await navigator.wakeLock.request("screen");
              wakeLock.addEventListener("release", () => (wakeLock = null));
            } catch {
              wakeLock = null;
            }
          };
          requestWakeLock();
          document.addEventListener("visibilitychange", requestWakeLock);
          document.addEventListener("pointerdown", requestWakeLock, { passive: true });
        }

        if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
          window.addEventListener("load", () =>
            navigator.serviceWorker.register("./sw.js").catch(() => {}),
          );
        }
      })();
    </script>
  </body>
</html>
